<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 340" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Dark Glass Gradient Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B1021" />
      <stop offset="100%" stop-color="#05070E" />
    </linearGradient>

    <!-- Glassmorphic Card Overlay -->
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0.3" />
    </linearGradient>

    <!-- Text Glow Gradient -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#818CF8" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="greenCyan" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glowing Line Gradients -->
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.8" />
    </linearGradient>

    <!-- Neon Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="strongGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1E293B" stroke-opacity="0.35" stroke-width="1" />
      <circle cx="30" cy="30" r="1" fill="#38BDF8" fill-opacity="0.3" />
    </pattern>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.4; filter: drop-shadow(0 0 6px rgba(56,189,248,0.4)); }
      50% { opacity: 0.9; filter: drop-shadow(0 0 16px rgba(192,132,252,0.8)); }
    }

    @keyframes rotateRadar {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes dashCycle {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes scanline {
      0% { transform: translateY(-100%); }
      100% { transform: translateY(340px); }
    }

    @keyframes floatNode {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-6px); }
    }

    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'Cascadia Code', monospace; }
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', Roboto, sans-serif; }
    
    .pulse { animation: pulseGlow 4s ease-in-out infinite; }
    .radar { transform-origin: 820px 170px; animation: rotateRadar 18s linear infinite; }
    .dash-line { stroke-dasharray: 12, 12; animation: dashCycle 6s linear infinite; }
    .cursor { animation: blinkCursor 1s infinite; }
    .float-slow { animation: floatNode 5s ease-in-out infinite; }
    .float-fast { animation: floatNode 3.5s ease-in-out infinite alternate; }
  </style>

  <!-- Background Layer -->
  <rect width="1000" height="340" fill="url(#bgGrad)" rx="16" />
  <rect width="1000" height="340" fill="url(#grid)" rx="16" />

  <!-- Ambient Light Orbs -->
  <circle cx="150" cy="80" r="180" fill="#38BDF8" opacity="0.08" filter="url(#glow)" />
  <circle cx="850" cy="240" r="220" fill="#C084FC" opacity="0.07" filter="url(#glow)" />
  <circle cx="500" cy="170" r="120" fill="#818CF8" opacity="0.05" filter="url(#glow)" />

  <!-- Outer Glass Border -->
  <rect x="12" y="12" width="976" height="316" rx="12" fill="url(#glassGrad)" stroke="#334155" stroke-width="1.5" stroke-opacity="0.5" />

  <!-- Tech Network Circuit / Constellation Visuals (Right Side) -->
  <g class="float-slow">
    <!-- Connecting Lines -->
    <line x1="720" y1="100" x2="820" y2="170" stroke="url(#lineGrad)" stroke-width="1.5" class="dash-line" />
    <line x1="820" y1="170" x2="910" y2="110" stroke="url(#lineGrad)" stroke-width="1.5" />
    <line x1="820" y1="170" x2="890" y2="250" stroke="url(#lineGrad)" stroke-width="1.5" class="dash-line" />
    <line x1="720" y1="100" x2="750" y2="230" stroke="url(#lineGrad)" stroke-width="1.5" />
    <line x1="750" y1="230" x2="890" y2="250" stroke="url(#lineGrad)" stroke-width="1.5" />

    <!-- Radar Ring -->
    <circle cx="820" cy="170" r="75" fill="none" stroke="#38BDF8" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4,8" class="radar" />
    <circle cx="820" cy="170" r="115" fill="none" stroke="#818CF8" stroke-width="1" stroke-opacity="0.15" />

    <!-- Nodes -->
    <circle cx="820" cy="170" r="7" fill="#38BDF8" filter="url(#strongGlow)" class="pulse" />
    <circle cx="820" cy="170" r="3" fill="#FFFFFF" />

    <circle cx="720" cy="100" r="5" fill="#818CF8" filter="url(#glow)" />
    <circle cx="910" cy="110" r="5" fill="#C084FC" filter="url(#glow)" />
    <circle cx="750" cy="230" r="4.5" fill="#34D399" filter="url(#glow)" />
    <circle cx="890" cy="250" r="5.5" fill="#38BDF8" filter="url(#glow)" />
  </g>

  <!-- Left Header Content -->
  <!-- Status Badge Header -->
  <g transform="translate(45, 45)">
    <!-- Pill Box -->
    <rect x="0" y="0" width="220" height="26" rx="13" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="14" cy="13" r="4" fill="#34D399" filter="url(#glow)" class="pulse" />
    <text x="26" y="17" fill="#94A3B8" class="font-mono" font-size="11" font-weight="600" letter-spacing="1">TENSOR OS // SYSTEM ONLINE</text>
  </g>

  <!-- Main Title: GARAD9901 -->
  <text x="45" y="118" fill="url(#cyanPurple)" class="font-sans" font-size="38" font-weight="900" letter-spacing="-0.5" filter="url(#glow)">
    Garad9901
  </text>
  <text x="238" y="118" fill="#F8FAFC" class="font-sans" font-size="38" font-weight="300" letter-spacing="-0.5">
    | AI Research Lab
  </text>

  <!-- Tagline Subtitle -->
  <text x="45" y="150" fill="#94A3B8" class="font-mono" font-size="13" letter-spacing="0.5">
    Full-Stack Neuro-Symbolic AI &bull; Geospatial Intelligence &bull; Computer Vision
  </text>

  <!-- Feature Pillar Badges -->
  <g transform="translate(45, 175)">
    <!-- Badge 1: MathGPT Enterprise -->
    <g transform="translate(0,0)">
      <rect width="165" height="30" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#38BDF8" stroke-opacity="0.4" />
      <text x="12" y="19" fill="#38BDF8" class="font-mono" font-size="11" font-weight="600">&#9883; MathGPT Enterprise</text>
    </g>

    <!-- Badge 2: AgroSense AI -->
    <g transform="translate(177,0)">
      <rect width="135" height="30" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#34D399" stroke-opacity="0.4" />
      <text x="12" y="19" fill="#34D399" class="font-mono" font-size="11" font-weight="600">&#127806; AgroSense AI</text>
    </g>

    <!-- Badge 3: GAIA GIS -->
    <g transform="translate(324,0)">
      <rect width="130" height="30" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#818CF8" stroke-opacity="0.4" />
      <text x="12" y="19" fill="#818CF8" class="font-mono" font-size="11" font-weight="600">&#127757; GAIA Platform</text>
    </g>

    <!-- Badge 4: SMEAR CV -->
    <g transform="translate(466,0)">
      <rect width="135" height="30" rx="6" fill="#1E293B" fill-opacity="0.7" stroke="#C084FC" stroke-opacity="0.4" />
      <text x="12" y="19" fill="#C084FC" class="font-mono" font-size="11" font-weight="600">&#128300; SMEAR AI Diagnostics</text>
    </g>
  </g>

  <!-- Bottom Telemetry Bar -->
  <g transform="translate(45, 272)">
    <line x1="0" y1="-15" x2="910" y2="-15" stroke="#1E293B" stroke-width="1" />

    <!-- Terminal Prompt Item 1 -->
    <text x="0" y="8" fill="#38BDF8" class="font-mono" font-size="11" font-weight="700">&gt;</text>
    <text x="14" y="8" fill="#64748B" class="font-mono" font-size="11">PRIMARY_STACK:</text>
    <text x="120" y="8" fill="#E2E8F0" class="font-mono" font-size="11" font-weight="600">PyTorch, Lean 4, SymPy, Gemini 2.5, Next.js, GIS</text>

    <!-- Terminal Item 2 -->
    <text x="640" y="8" fill="#34D399" class="font-mono" font-size="11" font-weight="700">&bull;</text>
    <text x="652" y="8" fill="#64748B" class="font-mono" font-size="11">VERIFICATION:</text>
    <text x="745" y="8" fill="#34D399" class="font-mono" font-size="11" font-weight="600">PASSED (Lean 4)</text>
    <text x="850" y="8" fill="#38BDF8" class="font-mono cursor" font-size="12">&#9646;</text>
  </g>
</svg>
